<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bekræftelse</title>

<style>
    * {
        box-sizing: border-box;
    }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b5a57;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: #ffffff;
    width: 90%;
    max-width: 550px;
    padding: 40px;
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    text-align: center;
}

h1 {
    color: #0b5a57;
    font-size: 32px;
    margin-bottom: 15px;
}

p {
    color: #555;
    line-height: 1.6;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    font-size: 16px;
    background: #fafafa;
}

input:focus {
    border-color: #0b5a57;
    outline: none;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    background: #4f8b79;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #3e7263;
}

.winner {
    font-size: 24px;
    font-weight: bold;
    color: #0b5a57;
    margin-top: 20px;
}

.emoji {
    font-size: 60px;
    margin-bottom: 15px;
}

.banner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    background: white;
    padding: 18px 40px;
    color: #0b5a57;
    font-size: 28px;
    font-weight: bold;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="container">

    <div id="formPage">
        <h1>Tilmelding til Danish Crown Padel Turnering 2026</h1>
        <p>Velkommen til årets interne padelturnering .Indtast dit navn for at fortsætte.</p>

        <input type="text" id="nameInput" placeholder="Indtast dit navn">

        <button onclick="submitForm()">Underskriv</button>
    </div>

    <div id="successPage">
        <div class="emoji">🎾</div>

        <h1>Tak for din underskrift!</h1>

        <p id="signedName"></p>

        <div class="winner">
            Du har nu skrevet under på, at Michael og Roshan er bedre end dig til padel.
        </div>
    </div>

</div>

<script>
function submitForm() {

    let name = document.getElementById("nameInput").value.trim();

    if(name === "") {
        alert("Du skal indtaste dit navn.");
        return;
    }

    document.getElementById("signedName").innerHTML =
        "<strong>" + name + "</strong> har nu underskrevet erklæringen.";

    document.getElementById("formPage").style.display = "none";
    document.getElementById("successPage").style.display = "block";
}
</script>

</body>
</html>
